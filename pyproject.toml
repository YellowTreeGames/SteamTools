[project]
name = "steamtools"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.9.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "mcp>=1.28.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.0",
    "typer>=0.26.7",
]

[project.scripts]
sto = "steamtools_cli.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
