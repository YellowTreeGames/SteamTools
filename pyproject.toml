[project]
name = "steamtools"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.9.0",
    "jinja2>=3.1.6",
    "mcp>=1.28.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "typer>=0.26.7",
]

[project.scripts]
sto = "steamtools_cli.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.16.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP006", "UP007"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true

[tool.bandit]
skips = ["B608"]

[tool.pytest.ini_options]
markers = [
    "integration: live HTTP calls to the Steam API — excluded from normal CI",
    "e2e: full CLI pipeline tests against a real temp DB and live Steam — excluded from normal CI",
]
