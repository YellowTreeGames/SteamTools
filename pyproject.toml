[project]
name = "steamtools"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.9.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "mcp>=1.28.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.0",
    "typer>=0.26.7",
]

[project.scripts]
sto = "steamtools_cli.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=steamtools",
    "--cov=steamtools_cli",
    "--cov=steamtools_mcp",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP006", "UP007"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true

[tool.bandit]
skips = ["B608"]
